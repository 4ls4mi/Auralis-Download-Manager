[package]
name = "mister-hybrid-glass"
version = "0.3.15"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"
default-run = "auralis-download-manager"

[[bin]]
name = "auralis-download-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
mdm-ipc = { path = "../../crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"

[workspace]

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[target.'cfg(windows)'.dependencies.sha2]
version = "0.10"

[target.'cfg(windows)'.dependencies.semver]
version = "1"
