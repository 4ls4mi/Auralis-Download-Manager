[package]
name = "mister-hybrid-glass"
version = "0.3.26"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"
default-run = "auralis-download-manager"

[[bin]]
name = "auralis-download-manager"
path = "src/main.rs"

[features]
default = ["embedded-downloader"]
embedded-downloader = ["dep:mdm-app"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
mdm-ipc = { path = "../../crates/ipc" }
mdm-app = { path = "../../crates/app", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"

[workspace]

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[target.'cfg(windows)'.dependencies.sha2]
version = "0.10"

[target.'cfg(windows)'.dependencies.semver]
version = "1"

# Cargo only applies patches from the active workspace; keep these aligned
# with the root workspace so the embedded downloader uses the same forks.
[patch.crates-io]
librqbit = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
