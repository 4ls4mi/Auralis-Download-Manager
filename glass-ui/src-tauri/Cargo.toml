[package]
name = "mister-hybrid-glass"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
mdm-ipc = { path = "../../crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"

[workspace]
