# Mister Hybrid V4: Windows x64 only, native glass UI build/test/installer.
# Never tags or publishes this as an official release.
name: Mister Hybrid V4 Windows

on:
  push:
    branches: ["feature/plexo-glass-v4-polish"]
  workflow_dispatch:

permissions:
  contents: read

# Do not abort active Windows builds on later commits.
concurrency:
  group: mister-hybrid-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout V4 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Desktop tests and theme validation
        run: cargo test -p mdm-app --target x86_64-pc-windows-msvc

      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: ./tools/installer/build.ps1 -Arch x64

      - name: Smoke test Windows download executables
        run: python tools/installer/smoke.py target/x86_64-pc-windows-msvc/release x64

      - name: Visual smoke test — actual Windows wallpaper rendering
        # A graphical runner can lack a working GPU/PrintWindow. Report that
        # separately; do not suppress the verified installer if capture fails.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash
          if ($hash -ne "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695") {
            throw "Mesa checksum mismatch"
          }
          7z e "$env:RUNNER_TEMP\mesa.7z" -otarget/x86_64-pc-windows-msvc/release x64/opengl32.dll x64/libgallium_wgl.dll -y
          if ($LASTEXITCODE -ne 0) { throw "Mesa extraction failed" }
          ./tools/lab/v4-glass-screenshot.ps1 -Exe target/x86_64-pc-windows-msvc/release/misterdownloadmanager.exe

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mister-hybrid-v4-glass-qa
          path: target/qa/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer, portable ZIP and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mister-hybrid-v4-windows-x64
          path: target/dist/*
          if-no-files-found: warn
          retention-days: 14
