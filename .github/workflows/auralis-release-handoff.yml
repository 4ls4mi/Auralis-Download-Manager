name: Stage the verified Auralis 0.3.60 release

on:
  push:
    branches: [release/auralis-0.3.60-handoff]
    paths: [.github/workflows/auralis-release-handoff.yml]

permissions:
  actions: read
  contents: write

jobs:
  stage:
    name: Verify and attach existing Windows build artifacts
    if: github.repository == '4ls4mi/Auralis-Download-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6862df6357de9f8d1bc2f83eb9866c63672ca4e5
          persist-credentials: false
      - name: Check the source run and stage the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=0.3.60
          tag="v$version"
          release_commit=6862df6357de9f8d1bc2f83eb9866c63672ca4e5
          source_run=45042442758
          source_job=137269659464
          installer="Auralis.Download.Manager_${version}_x64-setup.exe"
          extensions=(auralis-chromium.zip auralis-edge-store.zip auralis-firefox.zip)
          assets=("installer/$installer" "${extensions[@]/#/extensions/}")
          test "$(git rev-parse HEAD)" = "$release_commit"
          python3 -m unittest discover -s .github/scripts -p 'test_verify_auralis_release.py'
          gh api "repos/$GH_REPO/actions/runs/$source_run" |
            jq -e --arg sha "$release_commit" '
              .status == "completed" and .conclusion == "success" and .head_sha == $sha
            ' >/dev/null
          gh api "repos/$GH_REPO/actions/jobs/$source_job" |
            jq -e --arg sha "$release_commit" --argjson run "$source_run" '
              .run_id == $run and .head_sha == $sha and .conclusion == "success" and
              (.labels | contains(["self-hosted", "Windows", "X64", "auralis"])) and
              ([.steps[] | select(.conclusion == "success") | .name] | contains([
                "Build and bundle the Qt installer", "Verify Windows installation and update relaunch",
                "Test the Rust engine bridge, recovery, and backup", "Package the browser extensions",
                "Upload the verified installer", "Upload the browser extension packages"
              ]))
            ' >/dev/null

          download_verified_archive() {
            local id="$1" name="$2" digest="$3" directory="$4"
            shift 4
            gh api "repos/$GH_REPO/actions/artifacts/$id" |
              jq -e --arg name "$name" --arg sha "$release_commit" --arg digest "sha256:$digest" +                --argjson run "$source_run" '
                .expired == false and .name == $name and .digest == $digest and
                .workflow_run.id == $run and .workflow_run.head_sha == $sha
              ' >/dev/null
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$name.zip"
            printf '%s  %s\n' "$digest" "$name.zip" | sha256sum --check
            python3 - "$name.zip" "$directory" "$@" <<'PY'
          import sys
          from zipfile import ZipFile
          archive_name, directory, *expected = sys.argv[1:]
          with ZipFile(archive_name) as archive:
              if sorted(archive.namelist()) != sorted(expected):
                  raise SystemExit(f"{archive_name}: artifact files differ from expected names")
              if any(not 0 < entry.file_size <= 256 * 1024 * 1024 for entry in archive.infolist()):
                  raise SystemExit(f"{archive_name}: invalid artifact size")
              archive.extractall(directory)
          PY
          }
          download_verified_archive 14762662235 auralis-download-manager-windows-x64 +            1fd4851b993391259ae6132b4fd51767969d081c12722801e88e3f3d2030857e installer "$installer"
          download_verified_archive 14762512528 auralis-browser-extensions +            dab3703551dc2bc428ea9c8c2e77becb46b1efb7cd471ad63ad723a723831cf4 extensions "${extensions[@]}"

          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq +            ".[] | select(.draft and .tag_name == \"$tag\") | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" > release.json
          jq -e --arg sha "$release_commit" '.draft and .target_commitish == $sha and (.prerelease | not)' +            release.json >/dev/null
          missing=()
          for path in "${assets[@]}"; do
            name="${path##*/}"
            item="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' release.json)"
            if [[ -z "$item" ]]; then
              missing+=("$path")
            else
              digest="sha256:$(sha256sum "$path" | cut -d ' ' -f 1)"
              jq -e --arg digest "$digest" '.state == "uploaded" and .digest == $digest' <<< "$item" >/dev/null
            fi
          done
          if (( ${#missing[@]} )); then
            if ! gh release upload "$tag" "${missing[@]}"; then
              echo 'Upload command reported an error. Checking the stored assets.'
            fi
          fi
          for attempt in {1..5}; do
            gh api "repos/$GH_REPO/releases/$release_id" > release.json
            if python3 .github/scripts/verify-auralis-release.py release.json "$version" "$release_commit" "${assets[@]}"; then
              sha256sum "${assets[@]}"
              printf 'All assets verified on draft release %s.\n' "$release_id"
              exit 0
            fi
            sleep 4
          done
          exit 1
