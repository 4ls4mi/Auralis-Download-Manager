name: Glass isolated Windows upgrade check
on:
  push:
    branches: ['feature/connection-loss-updater-windows']
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    if: contains(github.event.head_commit.message, '[upgrade-check]')
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previously built Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44143648966 --repo 4ls4mi/misterdownloadmanager --name mister-hybrid-glass-windows-x64-candidate --dir glass-ui/src-tauri/target/release/bundle/nsis
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the candidate installer' }
      - name: Test isolated installation, upgrade and restart
        shell: pwsh
        run: ./tools/lab/glass-upgrade-windows.ps1
