name: Publish verified Auralis 0.3.49

on:
  workflow_run:
    workflows: ['Auralis Windows build on your PC']
    types: [completed]
    branches: ['wip/auralis-release-candidate']

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_sha == '8765d27dcd30a78d922f543a27181b1b6f883f01' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '8765d27dcd30a78d922f543a27181b1b6f883f01'
          persist-credentials: false
      - name: Verify and publish the tested installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_RUN: ${{ github.event.workflow_run.id }}
          TESTED_SHA: '8765d27dcd30a78d922f543a27181b1b6f883f01'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_verify_auralis_release.py'
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("glass-ui/src-tauri/Cargo.toml", "rb"))["package"]["version"])')"
          test "$version" = '0.3.49'
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "$tag is already published; leaving it unchanged."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to replace it." >&2; exit 1
          fi
          gh run download "$TESTED_RUN" --name auralis-download-manager-windows-x64 --dir installer
          gh run download "$TESTED_RUN" --name auralis-browser-extensions --dir extensions
          test "$(find installer -type f | wc -l)" -eq 1
          test -f "installer/Auralis Download Manager_${version}_x64-setup.exe"
          for name in auralis-chromium.zip auralis-edge-store.zip auralis-firefox.zip; do test -f "extensions/$name"; done
          cp "installer/Auralis Download Manager_${version}_x64-setup.exe" "Auralis.Download.Manager_${version}_x64-setup.exe"
          gh release create "$tag" --draft --target "$TESTED_SHA" --title "Auralis Download Manager $version — Windows x64" --notes-file "docs/glass-releases/$tag.md"
          gh release upload "$tag" "Auralis.Download.Manager_${version}_x64-setup.exe" extensions/*.zip
          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name==\"$tag\" and .draft==true) | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          verified=false
          for attempt in {1..15}; do
            if gh api "repos/$GH_REPO/releases/$release_id" > release.json &&
              python3 .github/scripts/verify-auralis-release.py release.json "$version" "$TESTED_SHA" \
                "Auralis.Download.Manager_${version}_x64-setup.exe" extensions/*.zip; then
              verified=true
              break
            fi
            echo "Waiting for release assets and their digests (attempt $attempt/15)."
            sleep 4
          done
          if [[ "$verified" != true ]]; then
            echo '::error::Release assets could not be verified; the release remains a draft.'
            exit 1
          fi
          gh release edit "$tag" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$TESTED_SHA"
