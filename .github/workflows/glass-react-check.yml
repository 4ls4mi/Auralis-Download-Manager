# Rapid Windows-only compile test for the new React visual layer.
# Separate from the much longer original Rust + Tauri installer build.
name: Mister Hybrid Glass React Check
on:
  push:
    branches: ["feature/progress-chunks-windows", "feature/ice-crystal-parity-windows"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: glass-ui
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
      - name: Exercise GPU backdrop compositor with synthetic frames
        run: |
          node tests/refraction-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw "GPU backdrop compositor test failed" }
      - name: Check selected chunk counts and engine byte accounting
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Chunk accounting tests failed" }
      - name: Check React and TypeScript
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "React/TypeScript compile failed" }
      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: mister-hybrid-glass-ui-compiled
          path: glass-ui/dist/
          if-no-files-found: error
          retention-days: 7
  native-renderer-lab:
    name: Native Direct2D geometry lab
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test Windows x64 geometry
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual C++ x64 tools not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'build-native-glass.cmd'
          @("@call `"$vcvars`" >nul", 'cl /nologo /EHsc /std:c++17 tools\lab\native-glass\main.cpp /link /subsystem:windows /out:native-glass-lab.exe', '@if errorlevel 1 exit /b %errorlevel%', 'cl /nologo /EHsc /std:c++17 /c glass-ui\src-tauri\src\water_surface.cpp /Fo:water_surface.obj', '@if errorlevel 1 exit /b %errorlevel%', 'cl /nologo /EHsc /std:c++17 /c glass-ui\src-tauri\src\water_d3d11.cpp /Fo:water_d3d11.obj', '@if errorlevel 1 exit /b %errorlevel%', 'cl /nologo /EHsc /std:c++20 /c glass-ui\src-tauri\src\water_composition.cpp /Fo:water_composition.obj', '@if errorlevel 1 exit /b %errorlevel%', 'cl /nologo /EHsc /std:c++17 tools\lab\native-glass\d3d11_smoke.cpp water_d3d11.obj /link /subsystem:console /out:d3d11-smoke.exe user32.lib comctl32.lib d3d11.lib dxgi.lib d3dcompiler.lib', '@if errorlevel 1 exit /b %errorlevel%', 'd3d11-smoke.exe', '@if errorlevel 1 exit /b %errorlevel%', 'cl /nologo /EHsc /std:c++20 tools\lab\native-glass\backdrop.cpp /link /subsystem:windows /out:host-backdrop-lab.exe', '@exit /b %errorlevel%') | Set-Content -Encoding ascii $batch
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Direct2D lab compilation failed" }
          $test = Start-Process -FilePath "$PWD\native-glass-lab.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Direct2D geometry self-test failed: $($test.ExitCode)" }
      - name: Capture host backdrop experiment
        timeout-minutes: 2
        shell: pwsh
        run: |
          $transparency = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -ErrorAction SilentlyContinue
          Write-Host "Transparency setting: $($transparency.EnableTransparency)"
          Get-CimInstance Win32_VideoController | Select-Object Name,Status,DriverVersion | Format-List
          $lab = Start-Process -FilePath "$PWD\host-backdrop-lab.exe" -ArgumentList '--fixture' -PassThru
          try {
            Start-Sleep -Seconds 5
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bitmap.Size)
              $bitmap.Save((Join-Path $env:RUNNER_TEMP 'host-backdrop-review.png'))
            } finally { $graphics.Dispose(); $bitmap.Dispose() }
          } finally { if (-not $lab.HasExited) { Stop-Process -Id $lab.Id -Force } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-host-backdrop-review
          path: |
            ${{ runner.temp }}/host-backdrop-review.png
            host-backdrop-lab.exe
          if-no-files-found: warn
          retention-days: 7
  native-tauri-check:
    name: Windows x64 native surface integration
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Tauri resource paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force glass-ui/src-tauri/resources,glass-ui/src-tauri/icons,glass-ui/dist | Out-Null
          Copy-Item crates/app/assets/icons/app/mdm.ico glass-ui/src-tauri/icons/icon.ico
          Set-Content glass-ui/src-tauri/resources/mdm-legacy.exe ''
          Set-Content glass-ui/src-tauri/resources/misterdownloadmanager-nmhost.exe ''
          Set-Content glass-ui/dist/index.html '<!doctype html><title>compile check</title>'
      - name: Check Windows x64 shell and native bridge
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --manifest-path glass-ui/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Native Tauri surface integration failed to compile' }
  protocol:
    name: Original browser protocol
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use stable Windows x64 Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Preserve original IPC and native-host behavior
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc -p mdm-ipc -p mdm-nmhost
          if ($LASTEXITCODE -ne 0) { throw 'Original browser protocol regression tests failed' }

  composition-water-lab:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40' -OutFile "$env:RUNNER_TEMP\webview.zip"
          Expand-Archive "$env:RUNNER_TEMP\webview.zip" -DestinationPath "$env:RUNNER_TEMP\webview"
      - name: Compile x64 composition-hosted test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview\build\native'
          $batch = Join-Path $env:RUNNER_TEMP 'compile-composition-water.cmd'
          @("@call `"$vcvars`" >nul", "cl /nologo /utf-8 /EHsc /std:c++20 /I`"$sdk\include`" tools\lab\composition-water\main.cpp /link /subsystem:windows /out:composition-water-lab.exe `"$sdk\x64\WebView2Loader.dll.lib`"", '@exit /b %errorlevel%') | Set-Content -Encoding ascii $batch
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'Composition lab compile failed' }
          Copy-Item "$sdk\x64\WebView2Loader.dll" .
      - name: Capture actual lab window
        shell: pwsh
        run: |
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'water-lab-webview'
          $lab = Start-Process -FilePath "$PWD\composition-water-lab.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $lab.Refresh()
              if ($lab.HasExited) { throw "Lab exited early: $($lab.ExitCode)" }
              if ($lab.MainWindowTitle -like '*composition lab*') { $ready = $true; break }
            }
            if (-not $ready) { throw "Composition WebView did not initialize: $($lab.MainWindowTitle)" }
            Start-Sleep -Seconds 5
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try { $graphics.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bitmap.Size); $bitmap.Save((Join-Path $env:RUNNER_TEMP 'composition-water.png')) }
            finally { $graphics.Dispose(); $bitmap.Dispose() }
            # Exercise real Win32-to-WebView mouse forwarding, not just startup.
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class WaterLabInput {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int left, top, right, bottom; }
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int command);
          }
          '@
            $handle = $lab.MainWindowHandle
            $rect = New-Object WaterLabInput+RECT
            [void][WaterLabInput]::GetClientRect($handle, [ref]$rect)
            $width = $rect.right; $height = $rect.bottom
            $windowRect = New-Object WaterLabInput+RECT
            [void][WaterLabInput]::GetWindowRect($handle, [ref]$windowRect)
            $hitPoint = (($windowRect.top + 45) -shl 16) -bor ($windowRect.left + 100)
            $hit = [WaterLabInput]::SendMessage($handle, 0x84, [IntPtr]::Zero, [IntPtr]$hitPoint).ToInt32()
            if ($hit -ne 2) { throw "Custom title drag hit test failed: $hit" }
            function Click-Lab([int]$x, [int]$y) {
              $point = [IntPtr](($y -shl 16) -bor $x)
              [void][WaterLabInput]::SendMessage($handle, 0x201, [IntPtr]1, $point)
              [void][WaterLabInput]::SendMessage($handle, 0x202, [IntPtr]0, $point)
            }
            Click-Lab ($width - 210) ($height - 58)
            $clicked = $false
            for ($i=0; $i -lt 10; $i++) { Start-Sleep -Milliseconds 300; $lab.Refresh(); if ($lab.MainWindowTitle -like '*Pause input OK*') { $clicked=$true; break } }
            if (-not $clicked) { throw "Pause input was not delivered: $($lab.MainWindowTitle)" }
            Click-Lab ($width - 147) 55
            Start-Sleep -Seconds 1
            if (-not [WaterLabInput]::IsIconic($handle)) { throw 'Custom minimize control did not minimize the window' }
            [void][WaterLabInput]::ShowWindow($handle, 9)
            Start-Sleep -Seconds 1
            Click-Lab ($width - 65) 55
            if (-not $lab.WaitForExit(5000)) { throw 'Custom close control did not close the window' }
          } finally { if (-not $lab.HasExited) { Stop-Process -Id $lab.Id -Force } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-water-lab-windows-x64
          path: |
            ${{ runner.temp }}/composition-water.png
            composition-water-lab.exe
            WebView2Loader.dll
          if-no-files-found: warn
          retention-days: 7
