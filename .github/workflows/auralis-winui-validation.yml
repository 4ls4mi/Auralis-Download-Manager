name: Auralis WinUI shell validation

on:
  workflow_dispatch:
  push:
    branches: [feature/auralis-winui-shell]
    paths:
      - 'winui-shell/**'
      - 'crates/auralis-winui-bridge/**'
      - 'glass-ui/**'
      - '.github/workflows/auralis-winui-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test local interface adapter
        shell: pwsh
        run: |
          node --test winui-shell/webview/compat.test.mjs winui-shell/webview/preview-compat.test.mjs winui-shell/webview/sandbox-compat.test.mjs
          if ($LASTEXITCODE) { throw 'WinUI interface adapter test failed.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build interface preview assets
        shell: pwsh
        working-directory: glass-ui
        run: |
          npm install
          if ($LASTEXITCODE) { throw 'Interface dependencies failed to install.' }
          npm run build
          if ($LASTEXITCODE) { throw 'Interface preview assets failed to build.' }
      - name: Test material mapping
        shell: pwsh
        run: |
          dotnet run --project winui-shell/MaterialPolicy.Tests/MaterialPolicy.Tests.csproj -c Release
          if ($LASTEXITCODE) { throw 'WinUI material mapping test failed.' }
      - name: Build isolated downloader bridge
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo build -p auralis-winui-bridge --lib --no-default-features
          if ($LASTEXITCODE) { throw 'Isolated downloader bridge build failed.' }
      - name: Build WinUI development shell
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild winui-shell/Auralis.WinUI/Auralis.WinUI.csproj /restore /m /p:Configuration=Debug /p:Platform=x64
          if ($LASTEXITCODE) { throw 'WinUI shell build failed.' }
          $adapter = Get-ChildItem winui-shell/Auralis.WinUI/bin -Recurse -Filter winui-preview-compat.js | Select-Object -First 1
          if (!$adapter -or !(Test-Path (Join-Path $adapter.DirectoryName 'index.html'))) { throw 'WinUI interface preview assets were not bundled.' }
          if (!(Test-Path (Join-Path $adapter.DirectoryName 'winui-sandbox-compat.js'))) { throw 'Isolated interface adapter was not bundled.' }
          $bridge = Get-ChildItem winui-shell/Auralis.WinUI/bin -Recurse -Filter auralis_winui_bridge.dll | Select-Object -First 1
          if (!$bridge) { throw 'Isolated downloader bridge was not bundled.' }
      - name: Test embedded downloader bridge
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo test -p auralis-winui-bridge --lib --no-default-features
          if ($LASTEXITCODE) { throw 'Embedded downloader bridge test failed.' }
