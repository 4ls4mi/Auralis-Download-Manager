name: Auralis Windows build

on:
  pull_request:
    paths:
      - "glass-ui/**"
      - ".github/workflows/auralis-windows.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/glass-releases/**"
  push:
    branches: [feature/brand-tray-identity]
    tags: ["v0.3.*"]
    paths:
      - "glass-ui/**"
      - ".github/workflows/auralis-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: 'Revision to build when warming the shared cache'
        required: true
        type: string
  create:

permissions:
  contents: write

concurrency:
  group: auralis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v0.3.'))
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: auralis-windows-x64
          cache-all-crates: true
          # Branches may refresh their own cache. Tags restore the shared
          # default-branch baseline without saving another large copy.
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          workspaces: |
            . -> target
            glass-ui/src-tauri -> target

      - name: Install Windows native build dependencies
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          if ($LASTEXITCODE) { throw "NASM installation failed" }
          "C:\\Program Files\\NASM" >> $env:GITHUB_PATH
          choco install nsis --no-progress -y
          if ($LASTEXITCODE) { throw "NSIS installation failed" }

      - name: Build original MDM engine and companion executables
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p mdm-app -p mdm-nmhost
          if ($LASTEXITCODE) { throw "Original MDM Rust backend compilation failed" }
          New-Item -ItemType Directory -Force glass-ui/src-tauri/resources | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/misterdownloadmanager.exe glass-ui/src-tauri/resources/mdm-legacy.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/misterdownloadmanager-nmhost.exe glass-ui/src-tauri/resources/misterdownloadmanager-nmhost.exe

      - name: Test original engine workspace
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Locate npm cache
        id: npm-cache-dir
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: npm-windows-${{ hashFiles('glass-ui/package.json') }}
          restore-keys: |
            npm-windows-

      - name: Install frontend dependencies
        working-directory: glass-ui
        run: npm install

      - name: Frontend tests
        working-directory: glass-ui
        run: npm test

      - name: Build frontend and generate Auralis icons
        working-directory: glass-ui
        run: npm run build

      - name: Verify generated Windows icon assets
        shell: pwsh
        run: |
          $ico = "glass-ui/src-tauri/icons/auralis.ico"
          $png = "glass-ui/src-tauri/icons/auralis.png"
          foreach ($path in @($ico, $png)) {
            if (-not (Test-Path $path)) { throw "Missing generated icon: $path" }
            if ((Get-Item $path).Length -lt 1024) { throw "Generated icon is unexpectedly small: $path" }
          }
          $bytes = [IO.File]::ReadAllBytes($ico)
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw "Auralis ICO header is invalid"
          }

      - name: Rust tests for the Tauri shell and updater
        working-directory: glass-ui
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        working-directory: glass-ui
        run: npm run tauri -- build --bundles nsis

      - name: Keep the 0.3.1 updater's installer filename compatible
        shell: pwsh
        run: |
          $version = (Get-Content glass-ui/src-tauri/Cargo.toml -Raw | Select-String -Pattern '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $folder = "glass-ui/src-tauri/target/release/bundle/nsis"
          $installer = Join-Path $folder "Auralis Download Manager_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing Auralis installer: $installer" }
          Copy-Item $installer (Join-Path $folder "Mister.Hybrid.Glass_${version}_x64-setup.exe")

      - name: Upload Auralis Windows release installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auralis-download-manager-windows-x64
          path: glass-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package Chromium and Firefox extensions
        shell: pwsh
        run: |
          node --check auralis-extension/background.js
          if ($LASTEXITCODE) { throw "Invalid extension background script" }
          node --check auralis-extension/video.js
          if ($LASTEXITCODE) { throw "Invalid extension video script" }
          node --check auralis-extension/thumbnail.js
          if ($LASTEXITCODE) { throw "Invalid extension thumbnail script" }
          New-Item -ItemType Directory -Force -Path extension-packages, extension-staging/chromium, extension-staging/firefox | Out-Null
          Copy-Item auralis-extension/* extension-staging/chromium/ -Recurse -Force
          Copy-Item auralis-extension/* extension-staging/firefox/ -Recurse -Force
          Copy-Item extension-staging/firefox/manifest.firefox.json extension-staging/firefox/manifest.json -Force
          Compress-Archive -Path extension-staging/chromium/* -DestinationPath extension-packages/auralis-chromium.zip
          Compress-Archive -Path extension-staging/firefox/* -DestinationPath extension-packages/auralis-firefox.zip

      - name: Upload browser extension packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auralis-browser-extensions
          path: extension-packages/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Auralis Windows x64 release
        if: startsWith(github.ref, 'refs/tags/v0.3.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content glass-ui/src-tauri/Cargo.toml -Raw | Select-String -Pattern '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Auralis version $version" }
          $folder = "glass-ui/src-tauri/target/release/bundle/nsis"
          $installer = Join-Path $folder "Auralis Download Manager_${version}_x64-setup.exe"
          $legacy = Join-Path $folder "Mister.Hybrid.Glass_${version}_x64-setup.exe"
          $chromium = "extension-packages/auralis-chromium.zip"
          $firefox = "extension-packages/auralis-firefox.zip"
          foreach ($file in @($installer, $legacy, $chromium, $firefox)) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
          }
          $title = "Auralis Download Manager $version — Windows x64"
          $notes = "docs/glass-releases/v$version.md"
          $existingJson = gh release view "$env:GITHUB_REF_NAME" --json isDraft 2>$null
          $viewStatus = $LASTEXITCODE
          if ($viewStatus -eq 0) {
            $existingRelease = $existingJson | ConvertFrom-Json
            if (-not $existingRelease.isDraft) {
              Write-Host "Release $env:GITHUB_REF_NAME is already published; leaving its assets unchanged."
              exit 0
            }
            gh release upload "$env:GITHUB_REF_NAME" $installer $legacy $chromium $firefox --clobber
            if ($LASTEXITCODE) { throw "Uploading Auralis release assets failed" }
            gh release edit "$env:GITHUB_REF_NAME" --verify-tag --title $title --notes-file $notes --draft=false --prerelease=false --latest
            if ($LASTEXITCODE) { throw "Publishing the Auralis release failed" }
          } else {
            gh release create "$env:GITHUB_REF_NAME" --verify-tag --title $title --notes-file $notes --latest $installer $legacy $chromium $firefox
            if ($LASTEXITCODE) { throw "GitHub release creation or asset upload failed" }
          }
