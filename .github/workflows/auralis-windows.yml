name: Auralis Windows candidate

on:
  pull_request:
    paths:
      - "glass-ui/**"
      - ".github/workflows/auralis-windows.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/glass-releases/**"
  push:
    branches: [feature/brand-tray-identity]
    paths:
      - "glass-ui/**"
      - ".github/workflows/auralis-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auralis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE) { throw "NSIS installation failed" }

      - name: Install frontend dependencies
        working-directory: glass-ui
        run: npm install

      - name: Frontend tests
        working-directory: glass-ui
        run: npm test

      - name: Build frontend and generate Auralis icons
        working-directory: glass-ui
        run: npm run build

      - name: Verify generated Windows icon assets
        shell: pwsh
        run: |
          $ico = "glass-ui/src-tauri/icons/auralis.ico"
          $png = "glass-ui/src-tauri/icons/auralis.png"
          foreach ($path in @($ico, $png)) {
            if (-not (Test-Path $path)) { throw "Missing generated icon: $path" }
            if ((Get-Item $path).Length -lt 1024) { throw "Generated icon is unexpectedly small: $path" }
          }
          $bytes = [IO.File]::ReadAllBytes($ico)
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw "Auralis ICO header is invalid"
          }

      - name: Rust tests for the Tauri shell and updater
        working-directory: glass-ui
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        working-directory: glass-ui
        run: npm run tauri -- build --bundles nsis

      - name: Upload Auralis Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auralis-download-manager-windows-x64-candidate
          path: glass-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
