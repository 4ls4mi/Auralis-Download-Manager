# Rerun native acceptance on an already-built installer candidate, Windows x64 only.
name: Glass native Windows review
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Windows installer build run containing the candidate artifact'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mister-hybrid-glass-windows-x64-candidate
          path: ${{ runner.temp }}/glass-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run }}
      - name: Install WebView2 and the candidate in an isolated directory
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtime
          Start-Process $runtime -ArgumentList '/silent /install' -Wait
          $root = Join-Path $env:RUNNER_TEMP 'glass-native-acceptance'
          $installer = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'glass-installer') -Filter *.exe).FullName
          Start-Process $installer -ArgumentList "/S /D=$root" -Wait
          "GLASS_E2E_DIR=$root" >> $env:GITHUB_ENV
          "GLASS_E2E_EXE=$root\mister-hybrid-glass.exe" >> $env:GITHUB_ENV
          "GLASS_E2E_SOURCE_RUN=${{ inputs.source_run }}" >> $env:GITHUB_ENV
      - name: Install test client
        working-directory: glass-ui
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Real native acceptance
        shell: pwsh
        run: |
          node tools/lab/glass-native-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native acceptance failed; inspect proof artifact' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mister-hybrid-glass-windows-proof
          path: ${{ runner.temp }}/glass-native-acceptance/proof/
          if-no-files-found: warn
          retention-days: 14
