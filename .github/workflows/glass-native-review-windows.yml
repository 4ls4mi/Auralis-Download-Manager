# Rerun native acceptance on an already-built installer candidate, Windows x64 only.
name: Glass native Windows review
on:
  push:
    branches: ["feature/ice-crystal-parity-windows"]
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Windows installer build run containing the candidate artifact'
        required: true
        type: string
      experimental_water:
        description: 'Review the development-only Direct2D water surface'
        required: false
        type: boolean
        default: false
      renderer:
        description: 'Experimental native rendering backend'
        type: choice
        required: false
        default: direct2d
        options:
          - direct2d
          - d3d11
      host_backdrop:
        description: 'Attempt Windows host backdrop in the experimental Direct3D renderer'
        required: false
        type: boolean
        default: false
      package_experimental:
        description: 'Package a standalone experimental water test after acceptance'
        required: false
        type: boolean
        default: false
      rebuild_ui:
        description: 'Rebuild the current shell against the candidate backend'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native review]') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the installer candidate
        shell: pwsh
        env:
          GLASS_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GLASS_REQUESTED_RUN: ${{ inputs.source_run }}
        run: |
          $run = $env:GLASS_REQUESTED_RUN
          if (-not $run) { $run = [regex]::Match($env:GLASS_COMMIT_MESSAGE, 'source-run:(\d+)').Groups[1].Value }
          if ($run -notmatch '^\d+$') { throw 'Specify a valid installer source run' }
          "GLASS_REVIEW_RUN=$run" >> $env:GITHUB_ENV
      - name: Wait for the requested candidate build
        if: ${{ inputs.experimental_water }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $deadline = (Get-Date).AddMinutes(80)
          do {
            $run = gh run view $env:GLASS_REVIEW_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the requested build' }
            $candidate = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GLASS_REVIEW_RUN/artifacts" --jq '.artifacts[] | select(.name == "mister-hybrid-glass-windows-x64-candidate" and .expired == false) | .id'
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the candidate artifact' }
            if ($candidate) { break }
            if ($run.status -eq 'completed') { throw "Candidate build finished without an installer ($($run.conclusion))" }
            Start-Sleep -Seconds 30
          } while ((Get-Date) -lt $deadline)
          if (-not $candidate) { throw 'Candidate artifact did not become available in time' }
      - uses: actions/download-artifact@v4
        with:
          name: mister-hybrid-glass-windows-x64-candidate
          path: ${{ runner.temp }}/glass-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.GLASS_REVIEW_RUN }}
      - name: Install WebView2 and the candidate in an isolated directory
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtime
          Start-Process $runtime -ArgumentList '/silent /install' -Wait
          $root = Join-Path $env:RUNNER_TEMP 'glass-native-acceptance'
          $installer = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'glass-installer') -Filter *.exe).FullName
          Start-Process $installer -ArgumentList "/S /D=$root" -Wait
          "GLASS_E2E_DIR=$root" >> $env:GITHUB_ENV
          "GLASS_E2E_EXE=$root\mister-hybrid-glass.exe" >> $env:GITHUB_ENV
          "GLASS_E2E_SOURCE_RUN=$env:GLASS_REVIEW_RUN" >> $env:GITHUB_ENV
      - name: Install test client
        working-directory: glass-ui
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Rebuild the current Glass interface against the candidate backend
        if: ${{ inputs.rebuild_ui || contains(github.event.head_commit.message, '[rebuild ui]') }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force glass-ui/src-tauri/resources,glass-ui/src-tauri/icons | Out-Null
          Copy-Item (Join-Path $env:GLASS_E2E_DIR 'mdm-legacy.exe') glass-ui/src-tauri/resources/mdm-legacy.exe
          Copy-Item (Join-Path $env:GLASS_E2E_DIR 'misterdownloadmanager-nmhost.exe') glass-ui/src-tauri/resources/misterdownloadmanager-nmhost.exe
          Copy-Item crates/app/assets/icons/app/mdm.ico glass-ui/src-tauri/icons/icon.ico
          Push-Location glass-ui
          try { npm run tauri -- build --no-bundle; if ($LASTEXITCODE -ne 0) { throw 'Glass UI build failed' } }
          finally { Pop-Location }
          Get-Process 'mister-hybrid-glass','mdm-legacy' -ErrorAction SilentlyContinue | Stop-Process -Force
          Copy-Item glass-ui/src-tauri/target/release/mister-hybrid-glass.exe $env:GLASS_E2E_EXE -Force

      - name: Real native acceptance
        timeout-minutes: 7
        shell: pwsh
        env:
          MHG_EXPERIMENTAL_WATER: ${{ inputs.experimental_water && '1' || '0' }}
          MHG_EXPERIMENTAL_RENDERER: ${{ inputs.renderer || 'direct2d' }}
          MHG_EXPERIMENTAL_HOSTBACKDROP: ${{ inputs.host_backdrop && '1' || '0' }}
        run: |
          node tools/lab/glass-native-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native acceptance failed; inspect proof artifact' }
      - name: Prepare standalone experimental Water Bubble test
        if: ${{ inputs.package_experimental && inputs.rebuild_ui && success() }}
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'water-portable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item (Join-Path $env:GLASS_E2E_DIR 'mister-hybrid-glass.exe') $portable
          Copy-Item (Join-Path $env:GLASS_E2E_DIR 'mdm-legacy.exe') $portable
          Copy-Item (Join-Path $env:GLASS_E2E_DIR 'misterdownloadmanager-nmhost.exe') $portable
          Copy-Item tools/lab/water-portable/Start-Water-Test.cmd $portable
          Copy-Item tools/lab/water-portable/README.txt $portable
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.package_experimental && inputs.rebuild_ui && success() }}
        with:
          name: mister-hybrid-glass-experimental-water-windows-x64
          path: ${{ runner.temp }}/water-portable/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mister-hybrid-glass-windows-proof
          path: ${{ runner.temp }}/glass-native-acceptance/proof/
          if-no-files-found: warn
          retention-days: 14
