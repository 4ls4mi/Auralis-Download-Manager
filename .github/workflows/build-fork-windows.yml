# Build the user's hybrid-progress fork with a real Windows x64 runner.
# The source branch remains unmerged; nothing is published as an official release.
name: Fork Windows x64 Build

on:
  # On a newly enabled fork, adding this file on main can start the first build.
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-fork-windows.yml"
  # Rebuild a selected feature branch without pushing to main.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build (must exist in this fork)"
        required: true
        default: "feature/plexo-zajil-progress-ui"
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the hybrid UI branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'feature/plexo-zajil-progress-ui' }}
          persist-credentials: false

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: NASM for Windows cryptography libraries
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Inno Setup installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Format source for compilation
        run: cargo fmt --all

      - name: Compile and test desktop app
        run: cargo test -p mdm-app --target x86_64-pc-windows-msvc

      - name: Build Windows setup EXE and portable ZIP
        shell: pwsh
        run: ./tools/installer/build.ps1 -Arch x64

      - name: Smoke test Windows executables
        run: python tools/installer/smoke.py target/x86_64-pc-windows-msvc/release x64

      - name: Upload Windows installer and portable downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mister-hybrid-windows-x64
          path: target/dist/*
          if-no-files-found: warn
          retention-days: 14
