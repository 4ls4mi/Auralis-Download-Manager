name: Auralis Qt Windows build on your PC

on:
  workflow_call:
    inputs:
      coordinated_release:
        type: boolean
        default: false
    secrets:
      AURALIS_RELEASE_FONT_KEY:
        required: true
    outputs:
      installer-id:
        value: ${{ jobs.windows-x64.outputs.installer-id }}
      installer-digest:
        value: ${{ jobs.windows-x64.outputs.installer-digest }}
      extensions-id:
        value: ${{ jobs.windows-x64.outputs.extensions-id }}
      extensions-digest:
        value: ${{ jobs.windows-x64.outputs.extensions-digest }}
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish the verified installer and extensions
        default: false
      full_tests:
        type: boolean
        description: Run the full Rust regression suite
        default: false
  push:
    branches: [wip/auralis-qt-shell]
    paths:
      - 'qt-ui/**'
      - 'crates/**'
      - 'auralis-extension/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/scripts/**'
      - '.github/workflows/auralis-qt-windows.yml'
      - 'docs/glass-releases/**'

permissions:
  contents: read

# Share the legacy build lock because both use the same owner-managed caches and runner.
concurrency:
  group: auralis-self-hosted-windows
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build and verify the installed Qt application
    if: >-
      github.repository == '4ls4mi/Auralis-Download-Manager' &&
      github.ref == 'refs/heads/wip/auralis-qt-shell' &&
      (inputs.coordinated_release || github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[build-auralis-qt]'))
    runs-on: [self-hosted, Windows, X64, auralis]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: auralis-qt-source
    outputs:
      installer-id: ${{ steps.installer.outputs.artifact-id }}
      installer-digest: ${{ steps.installer.outputs.artifact-digest }}
      extensions-id: ${{ steps.extensions.outputs.artifact-id }}
      extensions-digest: ${{ steps.extensions.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          # Keep the clean source checkout separate from the legacy build and shared caches.
          path: auralis-qt-source
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Validate Windows packaging scripts
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -LiteralPath qt-ui/packaging -Filter '*.ps1' -File)
          $scripts += Get-Item -LiteralPath crates/auralis-qt-engine/src/install-update.ps1
          $scripts | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

      - name: Use the cached, verified native toolchain
        shell: pwsh
        run: ./qt-ui/packaging/windows-tools.ps1

      - name: Build and bundle the Qt installer
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '4'
          AURALIS_RELEASE_FONT_KEY: ${{ secrets.AURALIS_RELEASE_FONT_KEY }}
        run: ./qt-ui/packaging/build-windows.ps1 -BundleReleaseFonts

      - name: Verify Windows installation and update relaunch
        shell: pwsh
        run: ./qt-ui/packaging/test-installed-windows.ps1

      - name: Test the Rust engine bridge, recovery, and backup
        if: github.event_name == 'workflow_dispatch' && inputs.full_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AURALIS_ENGINE_REV = (git log -1 '--format=%h' '--' crates i18n assets Cargo.toml Cargo.lock .cargo rust-toolchain.toml).Trim()
          if ($LASTEXITCODE -ne 0 -or !$env:AURALIS_ENGINE_REV) { throw 'Could not determine the backend revision.' }
          cargo test --locked --target x86_64-pc-windows-msvc -p auralis-qt-engine --lib
          if ($LASTEXITCODE -ne 0) { throw 'Qt engine bridge tests failed.' }
          cargo test --locked --target x86_64-pc-windows-msvc -p mdm-app --test embedded_service
          if ($LASTEXITCODE -ne 0) { throw 'Embedded downloader tests failed.' }
          cargo test --locked --target x86_64-pc-windows-msvc -p mdm-app --lib -- backup_snapshot:: automatic_torrent_choice_tests paired_api_omits_private_downloads_and_sensitive_details
          if ($LASTEXITCODE -ne 0) { throw 'Backup or automatic torrent recovery tests failed.' }
          cargo test --locked --target x86_64-pc-windows-msvc -p mdm-app --lib torrent_recovery_handoff_tests
          if ($LASTEXITCODE -ne 0) { throw 'Torrent recovery handoff tests failed.' }

      - name: Package the browser extensions
        shell: pwsh
        run: |
          node --test .github/scripts/test_auralis_extension_boundary.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser handoff security tests failed.' }
          ./qt-ui/packaging/pack-extensions.ps1

      - name: Upload the verified installer
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auralis-download-manager-windows-x64${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ env.AURALIS_QT_INSTALLER }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the browser extension packages
        id: extensions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auralis-browser-extensions${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: |
            ${{ env.AURALIS_QT_EXTENSIONS }}/auralis-chromium.zip
            ${{ env.AURALIS_QT_EXTENSIONS }}/auralis-firefox.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove staging only
        if: always()
        shell: pwsh
        run: |
          if ($env:AURALIS_QT_JOB -and $env:AURALIS_QT_WORK) {
            $job = Join-Path $env:AURALIS_QT_WORK "run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if ($env:AURALIS_QT_JOB -ieq $job) {
              Remove-Item -LiteralPath $job -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

  publish:
    name: Publish verified public release
    needs: windows-x64
    if: >-
      !cancelled() && !inputs.coordinated_release &&
      github.repository == '4ls4mi/Auralis-Download-Manager' &&
      github.ref == 'refs/heads/wip/auralis-qt-shell' &&
      ((needs.windows-x64.result == 'success' &&
        ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[build-auralis-qt]') &&
          contains(github.event.head_commit.message, '[prepare-auralis-release]')))) ||
       (needs.windows-x64.result == 'skipped' && github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[publish-auralis-run:')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage and publish the verified Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AURALIS_INSTALLER_ARTIFACT_ID: ${{ needs.windows-x64.outputs.installer-id }}
          AURALIS_INSTALLER_ARTIFACT_DIGEST: ${{ needs.windows-x64.outputs.installer-digest }}
          AURALIS_EXTENSIONS_ARTIFACT_ID: ${{ needs.windows-x64.outputs.extensions-id }}
          AURALIS_EXTENSIONS_ARTIFACT_DIGEST: ${{ needs.windows-x64.outputs.extensions-digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] &&
             [[ "$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")" =~ \[publish-auralis-run:([0-9]+)\] ]]; then
            export AURALIS_VERIFIED_RUN_ID="${BASH_REMATCH[1]}"
          fi
          bash qt-ui/packaging/publish-windows.sh
