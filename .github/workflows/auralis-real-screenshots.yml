name: Capture Auralis Windows screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    if: github.repository == '4ls4mi/Auralis-Download-Manager'
    runs-on: [self-hosted, Windows, X64, auralis]
    timeout-minutes: 20
    steps:
      - name: Check out screenshot script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: docs-source
          persist-credentials: false
          clean: false
      - name: Set up Node.js 22
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheDir = Join-Path $env:RUNNER_WORKSPACE 'auralis-cache'
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          $archive = Join-Path $cacheDir 'node-v22.23.5-win-x64.zip'
          $nodeDir = Join-Path $cacheDir 'node-v22.23.5-win-x64'
          if (!(Test-Path (Join-Path $nodeDir 'node.exe'))) {
            if (!(Test-Path $archive)) { Invoke-WebRequest 'https://nodejs.org/dist/v22.23.5/node-v22.23.5-win-x64.zip' -OutFile $archive }
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a191082e9706866830379d577d2cc8a50c776fcd9436a8d061b063ed0d9a0e3') { Remove-Item $archive -Force; throw 'Node archive checksum mismatch.' }
            Expand-Archive -Path $archive -DestinationPath $cacheDir -Force
          }
          $nodeDir >> $env:GITHUB_PATH

      - name: Prepare screenshot tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsDir = Join-Path $env:LOCALAPPDATA 'AuralisRunner/capture-tools'
          New-Item -ItemType Directory -Force $toolsDir | Out-Null
          Set-Content -Path (Join-Path $toolsDir 'package.json') -Value '{"private":true}' -Encoding utf8
          Push-Location $toolsDir
          try { npm install --no-save --no-audit --no-fund playwright-core@1.56.0 }
          finally { Pop-Location }
          if ($LASTEXITCODE) { throw 'Could not prepare screenshot tools.' }
          "AURALIS_CAPTURE_TOOLS=$toolsDir" >> $env:GITHUB_ENV
      - name: Capture running Windows app
        shell: pwsh
        run: |
          $env:AURALIS_CAPTURE_EXE = Join-Path $env:LOCALAPPDATA 'AuralisRunner/target/release/auralis-download-manager.exe'
          $env:AURALIS_CAPTURE_OUTPUT = Join-Path $env:LOCALAPPDATA 'AuralisRunner/screenshot-output'
          if (!(Test-Path $env:AURALIS_CAPTURE_EXE)) { throw 'The cached Auralis executable is missing; build 0.3.26 first.' }
          $version = (Get-Item $env:AURALIS_CAPTURE_EXE).VersionInfo.ProductVersion
          if ($version -notlike '0.3.26*') { throw "Expected the Auralis 0.3.26 executable, found $version." }
          "AURALIS_CAPTURE_OUTPUT=$env:AURALIS_CAPTURE_OUTPUT" >> $env:GITHUB_ENV
          Remove-Item $env:AURALIS_CAPTURE_OUTPUT -Recurse -Force -ErrorAction SilentlyContinue
          node docs-source/docs/tools/capture-auralis-windows.mjs
          if ($LASTEXITCODE) { throw 'Screenshot capture failed.' }
      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auralis-real-windows-screenshots
          path: ${{ env.AURALIS_CAPTURE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
