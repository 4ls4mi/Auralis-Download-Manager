name: Deploy dedicated Super Booster release notifications

on:
  push:
    branches: [codex/super-booster-push-deploy]
    paths: [.github/workflows/deploy-super-booster-push.yml]

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == '4ls4mi/Auralis-Download-Manager' && github.ref == 'refs/heads/codex/super-booster-push-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 4ls4mi/super-booster
          ref: codex/super-booster-push-worker
          path: super-booster
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'

      - name: Validate and test the dedicated Worker
        working-directory: super-booster/release-push
        run: |
          python3 - <<'PY'
          import tomllib
          with open('wrangler.toml', 'rb') as file:
              config = tomllib.load(file)
          assert config['name'] == 'super-booster-release-push'
          assert config['main'] == 'worker.mjs'
          assert config['workers_dev'] is True
          assert not set(config) & {'account_id', 'env', 'route', 'routes'}
          PY
          node --test worker.test.mjs

      - name: Install pinned Wrangler
        env:
          WRANGLER_VERSION: '4.166.0'
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/super-booster-wrangler" "wrangler@$WRANGLER_VERSION"

      - name: Deploy Super Booster and configure its webhook secret
        id: deploy
        working-directory: super-booster/release-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPER_BOOSTER_WEBHOOK_SECRET: ${{ secrets.SUPER_BOOSTER_WEBHOOK_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SUPER_BOOSTER_WEBHOOK_SECRET"
          wrangler="$RUNNER_TEMP/super-booster-wrangler/node_modules/.bin/wrangler"
          deploy_log="$RUNNER_TEMP/super-booster-deploy.log"
          env -u SUPER_BOOSTER_WEBHOOK_SECRET "$wrangler" deploy --config wrangler.toml | tee "$deploy_log"
          mapfile -t urls < <(grep -Eo 'https://super-booster-release-push\.[a-z0-9-]+\.workers\.dev' "$deploy_log" | sort -u)
          test "${#urls[@]}" -eq 1
          printf '%s' "$SUPER_BOOSTER_WEBHOOK_SECRET" |
            env -u SUPER_BOOSTER_WEBHOOK_SECRET "$wrangler" secret put GITHUB_WEBHOOK_SECRET --config wrangler.toml
          echo "worker_url=${urls[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify signed webhook ping and WebSocket handshake
        env:
          SUPER_BOOSTER_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          SUPER_BOOSTER_WEBHOOK_SECRET: ${{ secrets.SUPER_BOOSTER_WEBHOOK_SECRET }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { createHmac } from 'node:crypto';
          import { setTimeout as wait } from 'node:timers/promises';

          const worker = new URL(process.env.SUPER_BOOSTER_WORKER_URL);
          assert.match(worker.hostname, /^super-booster-release-push\.[a-z0-9-]+\.workers\.dev$/);
          const webhook = new URL('/github/webhook', worker);
          const body = '{"zen":"Super Booster deployment probe"}';
          const digest = createHmac('sha256', process.env.SUPER_BOOSTER_WEBHOOK_SECRET).update(body).digest('hex');
          async function ping(signature) {
              const result = await fetch(webhook, {
                  method: 'POST', body, redirect: 'error', signal: AbortSignal.timeout(10000),
                  headers: {
                      'Content-Type': 'application/json',
                      'X-GitHub-Event': 'ping',
                      'X-Hub-Signature-256': `sha256=${signature}`,
                  },
              });
              await result.body?.cancel();
              return result.status;
          }

          for (let attempt = 0; attempt < 12; attempt++) {
              try {
                  if (await ping(digest) === 204) break;
              } catch { /* Allow deployment to propagate before checking again. */ }
              if (attempt === 11) throw new Error('No valid webhook response after deployment');
              await wait(5000);
          }
          assert.equal(await ping('0'.repeat(64)), 401);

          const endpoint = new URL('/events', worker);
          endpoint.protocol = 'wss:';
          await new Promise((resolve, reject) => {
              const socket = new WebSocket(endpoint);
              const timeout = setTimeout(() => {
                  reject(new Error('WebSocket handshake timed out'));
                  socket.close();
              }, 10000);
              socket.addEventListener('open', () => {
                  clearTimeout(timeout);
                  socket.close();
                  resolve();
              }, { once: true });
              socket.addEventListener('error', () => {
                  clearTimeout(timeout);
                  reject(new Error('WebSocket handshake failed'));
              }, { once: true });
          });
          console.log(`Verified ${webhook} and ${endpoint}`);
          JS
          echo "Super Booster endpoint: wss://${SUPER_BOOSTER_WORKER_URL#https://}/events" >> "$GITHUB_STEP_SUMMARY"

