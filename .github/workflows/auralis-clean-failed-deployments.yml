name: Remove failed Auralis deployment records

on:
  push:
    branches: [wip/auralis-qt-shell]
    paths: ['.github/workflows/auralis-clean-failed-deployments.yml']

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    if: github.repository == '4ls4mi/Auralis-Download-Manager' && contains(github.event.head_commit.message, '[clean-failed-deployments]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove the 21 verified failed deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENTS: '8001897507 7978811580 7972811094 7972631963 7972616065 7972595042 7972532074 7972479046 7972281361 7963507180 7961600196 7943594521 7942196053 7914173343 7884124844 7882271074 7881525595 7877090495 7871297742 7854677961 7824427840'
        shell: bash
        run: |
          set -euo pipefail
          for id in $DEPLOYMENTS; do
            deployment="$(gh api "repos/$GH_REPO/deployments/$id")"
            test "$(jq -r .environment <<< "$deployment")" = github-pages
            state="$(gh api "repos/$GH_REPO/deployments/$id/statuses" --jq '.[0].state')"
            if [[ "$state" != failure ]]; then
              echo "Deployment $id is $state. Keeping it."
              continue
            fi
            gh api --method POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive -F auto_inactive=false >/dev/null
            gh api --method DELETE "repos/$GH_REPO/deployments/$id"
            echo "Removed failed deployment $id."
          done
