name: Publish verified Auralis downloads

on:
  push:
    branches: [wip/auralis-publication]
    paths:
      - .github/workflows/auralis-publish-verified.yml
      - .github/scripts/publish-auralis-platforms.py

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified macOS downloads
    if: github.repository == '4ls4mi/Auralis-Download-Manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Add each verified disk image to the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-auralis-platforms.py macos
