name: IDM test links
on:
  push:
    branches: [bench/auralis-idm]
permissions:
  contents: read
concurrency:
  group: auralis-self-hosted-windows
  cancel-in-progress: false
jobs:
  idm:
    runs-on: [self-hosted, Windows, X64, auralis]
    timeout-minutes: 8
    steps:
      - name: Test two links in IDM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $idm = @("${env:ProgramFiles(x86)}\Internet Download Manager\IDMan.exe", "$env:ProgramFiles\Internet Download Manager\IDMan.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$idm) { throw 'IDM was not found for this runner account.' }
          $dest = Join-Path $env:RUNNER_TEMP ("idm-link-test-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $cases = @(
            @{name='Cloudflare';url='https://speed.cloudflare.com/__down?bytes=100000000';size=100000000},
            @{name='OVH';url='https://proof.ovh.net/files/100Mb.dat';size=104857600}
          )
          foreach ($case in $cases) {
            $filename = "$($case.name)-$env:GITHUB_RUN_ID.bin"
            $path = Join-Path $dest $filename
            $clock = [Diagnostics.Stopwatch]::StartNew()
            Start-Process -FilePath $idm -ArgumentList @('/d', $case.url, '/p', ('"' + $dest + '"'), '/f', $filename, '/n') | Out-Null
            $deadline = [DateTime]::UtcNow.AddSeconds(40)
            while ([DateTime]::UtcNow -lt $deadline) {
              if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -eq $case.size) { break }
              Start-Sleep -Milliseconds 250
            }
            $clock.Stop()
            if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -eq $case.size) {
              $seconds = [math]::Round($clock.Elapsed.TotalSeconds, 2)
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              Write-Host "$($case.name): completed $($case.size) bytes in $seconds seconds; SHA256 $hash"
            } else {
              Write-Host "$($case.name): expected output not completed within 40 seconds; no server error can be inferred."
            }
          }
          Write-Host "Test files folder: $dest"
