name: IDM requested link diagnostic
on:
  push:
    branches: [bench/auralis-idm]
permissions:
  contents: read
concurrency:
  group: auralis-self-hosted-windows
  cancel-in-progress: false
jobs:
  idm:
    runs-on: [self-hosted, Windows, X64, auralis]
    timeout-minutes: 4
    steps:
      - name: Test requested link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $idm = @("${env:ProgramFiles(x86)}\Internet Download Manager\IDMan.exe", "$env:ProgramFiles\Internet Download Manager\IDMan.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$idm) { throw 'IDM executable was not found.' }
          $dest = Join-Path $env:RUNNER_TEMP ("idm-mma-test-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $url = 'https://mmatechnical.com/Download/Download-Test-File/(MMA)-100MB.zip'
          $path = Join-Path $dest 'idm-test.zip'
          $currentSession = (Get-Process -Id $PID).SessionId
          $before = @(Get-Process IDMan -ErrorAction SilentlyContinue)
          Write-Host "Runner session: $currentSession; IDM processes before request: $($before.Count)"
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $idm -ArgumentList @('/d', ('"' + $url + '"'), '/p', ('"' + $dest + '"'), '/f', 'idm-test.zip', '/n') -PassThru
          Start-Sleep -Seconds 3
          $after = @(Get-Process IDMan -ErrorAction SilentlyContinue)
          Write-Host "IDM processes after request: $($after.Count); session IDs: $(($after.SessionId | Sort-Object -Unique) -join ', ')"
          if ($process.HasExited) { Write-Host "IDM launcher exit code: $($process.ExitCode)" }
          $deadline = [DateTime]::UtcNow.AddSeconds(75)
          while ([DateTime]::UtcNow -lt $deadline) {
            if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -eq 105826737) { break }
            Start-Sleep -Milliseconds 250
          }
          $clock.Stop()
          if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -eq 105826737) {
            Write-Host "IDM completed in $([math]::Round($clock.Elapsed.TotalSeconds,3)) seconds; SHA256 $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          } else {
            Write-Host "No completed file in the requested folder after $([math]::Round($clock.Elapsed.TotalSeconds,2)) seconds."
            Get-ChildItem -LiteralPath $dest -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Test output $($_.Name) $($_.Length) bytes" }
          }
          Write-Host "Test folder: $dest"
