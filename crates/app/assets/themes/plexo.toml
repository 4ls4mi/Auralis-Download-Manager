# Mister Hybrid V2 — near-black glass/charcoal Plexo-inspired theme.
# Draws using Mister's own native egui painters; no external UI source copied.
name = "Plexo Dark Glass"
icons = "mono"
icon-set = "metro"

[controls]
field-focus = "ring"
check = "fluent"
button = "fluent"
progress = "bar"
scroll = "overlay"
caption = "metro"
focus = "ring"

[sizes]
radius = 8
"radius.button" = 8
"radius.part" = 6
"radius.check" = 5
"radius.flyout" = 11
"radius.menu-item" = 7
"radius.egui" = 8
"radius.popup" = 9
border = 1
"focus-line" = 2
"list.row" = 22
"list.header" = 28
"font.ui" = 12
"font.ui.bold" = 13

[seeds.light]
background = "#F1F5F6"
surface = "#FFFFFF"
header = "#E8EEF0"
text = "#131C20"
accent = "#007F7A"
selection = "#D2EFEB"
error = "#B42336"
warning = "#936107"
success = "#007E69"

[seeds.dark]
background = "#0B0F11"
surface = "#161D20"
header = "#111619"
text = "#F1F7F8"
accent = "#34D8C9"
selection = "#174E4D"
error = "#FF989E"
warning = "#FFCF73"
success = "#5EE1C7"

