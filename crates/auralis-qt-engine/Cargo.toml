[package]
name = "auralis-qt-engine"
version = "0.3.90"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "auralis_engine"
crate-type = ["cdylib"]

[features]
default = ["browser-connection"]
browser-connection = ["mdm-app/browser-connection"]

[dependencies]
mdm-app = { path = "../app", default-features = false }
mdm-ipc.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
hex.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
semver = "1"
serde.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
