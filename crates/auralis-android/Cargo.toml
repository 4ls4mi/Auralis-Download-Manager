[package]
name = "auralis-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mdm-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
# QuickJS has no bundled Android bindings. Feature unification generates the engine's
# bindings with cargo-ndk's target sysroot without changing desktop dependencies.
rquickjs = { version = "0.14.0", default-features = false, features = ["bindgen"] }
rustls-platform-verifier.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
